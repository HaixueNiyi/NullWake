name: NullWake CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux-agent:
    name: Build & Test Linux Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            tsnet-bridge/go.sum

      - name: Vet and test Linux agent
        working-directory: agent
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test -v ./...

      - name: Vet and test tsnet-bridge
        working-directory: tsnet-bridge
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test -v ./...

      - name: Build static Linux binaries (amd64 & arm64)
        working-directory: agent
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/nullwake-agent-linux-amd64 ./cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/nullwake-agent-linux-arm64 ./cmd/agent
          ls -lh ../dist

      - name: Upload Linux agent binaries
        uses: actions/upload-artifact@v4
        with:
          name: nullwake-agent-linux
          path: dist/nullwake-agent-linux-*

  android-apk:
    name: Build Android Bridge & APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tsnet-bridge/go.mod
          cache-dependency-path: tsnet-bridge/go.sum

      - name: Install Android NDK and Build Tools
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "sdkmanager not found under ANDROID_HOME=${ANDROID_HOME}" >&2
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Install gomobile and build tsnet-bridge.aar
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:${PATH}"
          gomobile init
          (cd tsnet-bridge && go get golang.org/x/mobile/bind@latest)
          ./tsnet-bridge/build_aar.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode Persistent Android Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/ci-keystore.p12
            echo "NULLWAKE_KEYSTORE_FILE=${{ github.workspace }}/android/app/ci-keystore.p12" >> "$GITHUB_ENV"
          fi

      - name: Build Debug & Release APKs
        working-directory: android
        env:
          NULLWAKE_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NULLWAKE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NULLWAKE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleDebug assembleRelease --no-daemon
          rm -f app/ci-keystore.p12

      - name: Upload Android AAR & APKs
        uses: actions/upload-artifact@v4
        with:
          name: nullwake-android
          path: |
            android/app/libs/tsnet-bridge.aar
            android/app/build/outputs/apk/**/*.apk

  release:
    name: Publish GitHub Release
    needs: [linux-agent, android-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          TAG="${{ github.ref_name }}"
          awk -v tag="[$TAG]" '
            $0 ~ "^## " {
              if (found) exit
              if (index($0, tag) > 0) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md | sed '/^---$/,$d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "NullWake ${TAG}" > release-notes.md
          fi

      - name: Download Linux Agent Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nullwake-agent-linux
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nullwake-android
          path: release-assets

      - name: Collect Release Assets (3 files)
        run: |
          mkdir -p final-assets
          find release-assets -name "nullwake-agent-linux-amd64" -exec cp {} final-assets/nullwake-agent-linux-amd64 \;
          find release-assets -name "app-release.apk" -exec cp {} final-assets/nullwake-android-arm64-v8a-release.apk \;
          find release-assets -name "app-debug.apk" -exec cp {} final-assets/nullwake-android-arm64-v8a-debug.apk \;
          ls -lh final-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: final-assets/*
